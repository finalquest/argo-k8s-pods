apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-movies-nfs
spec:
  capacity:
    storage: 1000Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-manual
  mountOptions:
    - vers=4
  nfs:
    server: 10.1.0.152
    path: /data/exports/media/movies
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: movies-nfs
  namespace: media
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1000Gi
  storageClassName: nfs-manual
  volumeName: pv-movies-nfs
