apiVersion: v1
kind: ConfigMap
metadata:
  name: diskusage-script
  namespace: homepage
data:
  generate.sh: |
    #!/bin/sh
    # Regenera /out/usage.json con el tamaño por carpeta.
    OUT=/out/usage.json
    while true; do
      {
        printf '['
        sep=''
        for p in /mnt/media/books /mnt/media/movies /mnt/media/tv /mnt/downloads; do
          [ -d "$p" ] || continue
          kb=$(du -sk "$p" 2>/dev/null | cut -f1)
          [ -n "$kb" ] || kb=0
          printf '%s{"name":"%s","bytes":%s}' "$sep" "$(basename "$p")" "$((kb * 1024))"
          sep=','
        done
        printf ']'
      } > "$OUT.tmp" 2>/dev/null && mv "$OUT.tmp" "$OUT"
      sleep 900
    done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: diskusage
  namespace: homepage
  labels:
    app: diskusage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: diskusage
  template:
    metadata:
      labels:
        app: diskusage
    spec:
      nodeSelector:
        media-node: "true"
      containers:
        - name: generator
          image: busybox:1.36
          command:
            - sh
            - /scripts/generate.sh
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: out
              mountPath: /out
            - name: media
              mountPath: /mnt/media
              readOnly: true
            - name: downloads
              mountPath: /mnt/downloads
              readOnly: true
        - name: web
          image: nginx:alpine
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: out
              mountPath: /usr/share/nginx/html
      volumes:
        - name: scripts
          configMap:
            name: diskusage-script
            defaultMode: 0755
        - name: out
          emptyDir: {}
        - name: media
          persistentVolumeClaim:
            claimName: homepage-media-nfs
        - name: downloads
          persistentVolumeClaim:
            claimName: homepage-downloads-nfs
---
apiVersion: v1
kind: Service
metadata:
  name: diskusage
  namespace: homepage
spec:
  selector:
    app: diskusage
  ports:
    - name: http
      port: 80
      targetPort: 80
