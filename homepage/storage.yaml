apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-homepage-media-nfs
spec:
  capacity:
    storage: 1000Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-manual
  mountOptions:
    - vers=4
  nfs:
    server: 10.1.0.152
    path: /data/exports/media
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homepage-media-nfs
  namespace: homepage
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1000Gi
  storageClassName: nfs-manual
  volumeName: pv-homepage-media-nfs
