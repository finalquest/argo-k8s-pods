apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit
  namespace: logging
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         5
        Log_Level     info
        Parsers_File  parsers.conf
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020

    [INPUT]
        Name    syslog
        Mode    udp
        Listen  0.0.0.0
        Port    5140
        Parser  unifi
        Tag     unifi

    [INPUT]
        Name    syslog
        Mode    tcp
        Listen  0.0.0.0
        Port    5140
        Parser  unifi
        Tag     unifi

    [OUTPUT]
        Name         loki
        Match        unifi
        Host         loki-gateway.logging.svc.cluster.local
        Port         80
        Labels       job=unifi
        Line_Format  json
  parsers.conf: |
    [PARSER]
        Name        unifi
        Format      regex
        Regex       ^(?<message>.*)$
